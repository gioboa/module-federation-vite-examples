name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    strategy:
      fail-fast: false
      matrix:
        framework: [alpine, angular, lit, nuxt, preact, react, solid, svelte, tanstack, tanstack-ssr, vinext, vue]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Configure PNPM store
        run: pnpm config set store-dir ~/.pnpm-store/v10

      - name: Restore PNPM store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store/v10
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Test vite 7
        if: matrix.framework != 'nuxt' && matrix.framework != 'tanstack' && matrix.framework != 'tanstack-ssr' && matrix.framework != 'react'
        uses: ./.github/actions/test-vite
        with:
          vite-version: "7"
          framework: ${{ matrix.framework }}

      - name: Test vite 8
        if: matrix.framework != 'angular' && matrix.framework != 'tanstack-ssr' && matrix.framework != 'nuxt'
        uses: ./.github/actions/test-vite
        with:
          vite-version: "8"
          framework: ${{ matrix.framework }}

      - name: Test nuxt
        if: matrix.framework == 'nuxt'
        uses: ./.github/actions/test-vite
        with:
          framework: nuxt

      - name: Test tanstack-ssr (build)
        if: matrix.framework == 'tanstack-ssr'
        run: pnpm tanstack-ssr:build

      - name: Test tanstack-ssr (preview)
        id: test-tanstack-ssr-preview
        if: matrix.framework == 'tanstack-ssr'
        run: pnpm exec playwright test e2e/tanstack-start-ssr.spec.ts
        env:
          PLAYWRIGHT_TEST_COMMAND: pnpm tanstack-ssr:preview
          PLAYWRIGHT_REPORT_DIR: artifacts/playwright/tanstack-ssr/preview/report
          PLAYWRIGHT_TEST_RESULTS_DIR: artifacts/playwright/tanstack-ssr/preview/test-results

      - name: Upload tanstack-ssr test artifacts
        if: failure() && steps.test-tanstack-ssr-preview.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-tanstack-ssr-preview
          path: artifacts/playwright/tanstack-ssr/preview
          if-no-files-found: ignore
          retention-days: 7
